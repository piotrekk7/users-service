services:
  postgres:
    image: postgres:16-alpine
    container_name: users-demo-postgres
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d usersdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - users-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: users-demo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/usersdb
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    networks:
      - users-network

volumes:
  postgres-data:

networks:
  users-network:
    driver: bridge
