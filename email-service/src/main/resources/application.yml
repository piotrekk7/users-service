spring:
  application:
    name: email-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 5.0
          max-interval: 15000
          max-attempts: 4
          stateless: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  email:
    from: ${EMAIL_FROM:noreply@emailservice.app}

logging:
  level:
    app.emailservice: DEBUG
    org.springframework.amqp: DEBUG
    org.springframework.retry: DEBUG
    org.springframework.amqp.rabbit.retry: DEBUG
