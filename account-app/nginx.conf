server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy SSE requests to balance-service
    location /balance/stream {
        proxy_pass http://balance-service:8084/balance/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
